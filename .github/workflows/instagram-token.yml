# 매주 한 번 토큰 상태를 확인한다.
# 통합 로그인(시스템 사용자 토큰)은 만료되지 않아 확인만 하고,
# 예전 인스타 로그인 토큰(IG_USER_ID 변수 없음)일 때만 60일 기간을 연장한다.
name: 인스타 토큰 연장

on:
  schedule:
    - cron: "37 1 * * 1"   # 매주 월요일 한국 시간 오전 10:37
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 토큰이 있는지 확인
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN != '' }}
        run: |
          echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "IG_ACCESS_TOKEN 시크릿이 아직 없어요. 건너뜁니다."; fi

      - name: 토큰 확인
        if: steps.guard.outputs.ok == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE }}
        run: python3 instagram/publish.py check

      - name: 토큰 기간 연장
        if: steps.guard.outputs.ok == 'true' && vars.IG_USER_ID == ''
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 instagram/publish.py refresh

      # GH_PAT가 있으면 새 토큰을 시크릿에 자동으로 저장한다 (없으면 이 단계는 건너뜀)
      - name: 새 토큰 저장
        if: steps.guard.outputs.ok == 'true' && vars.IG_USER_ID == ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$NEW_TOKEN" ]; then
            echo "GH_PAT가 없어서 새 토큰을 저장하지 않았어요. 50일쯤마다 토큰을 직접 새로 넣어 주세요."
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
          echo "✓ 새 토큰을 저장했어요."
