# 이미 올라간 인스타 게시물 하나를 지운다 (손으로 실행).
name: 인스타 게시물 삭제

on:
  workflow_dispatch:
    inputs:
      media_id:
        description: "지울 게시물 번호 (instagram/posted/…/post.json의 media_id)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 게시물 삭제
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          GRAPH_BASE: ${{ vars.GRAPH_BASE }}
          MEDIA_ID: ${{ inputs.media_id }}
        run: python3 instagram/publish.py delete "$MEDIA_ID"
      - name: 기록 남기기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A instagram
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "인스타 게시물 삭제: ${{ inputs.media_id }}"
          git pull --rebase
          git push
